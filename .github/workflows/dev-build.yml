name: Dev Build

# Manual feature-branch builds for cross-machine testing: produces
# installable bundles as workflow artifacts WITHOUT tagging or publishing a
# release (the release channel stays main-only per the branching policy).
on:
  workflow_dispatch:

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        run: rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS bundle
        # createUpdaterArtifacts=false: dev builds must not try to sign the
        # updater package (no TAURI_SIGNING_PRIVATE_KEY outside releases).
        run: npm run tauri -- build --ci -b nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mykvm-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
