<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      布局画布点击磁贴时，在对应物理显示器上全屏铺一层透明窗口，
      只画一圈蓝色光圈提示"这块画布磁贴 = 这块真实屏幕"。
      窗口由 Rust 侧创建并定时关闭；本页无任何脚本，纯视觉。
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .ring {
        position: fixed;
        inset: 8px;
        border: 10px solid rgba(56, 150, 255, 0.92);
        border-radius: 18px;
        box-shadow:
          0 0 60px rgba(56, 150, 255, 0.5),
          inset 0 0 60px rgba(56, 150, 255, 0.5);
        animation: screen-flash-pulse 0.45s ease-in-out 3 alternate;
      }
      @keyframes screen-flash-pulse {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
  </body>
</html>
